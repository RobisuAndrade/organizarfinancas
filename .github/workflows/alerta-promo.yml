name: Alerta de promoções

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      palavra_teste:
        description: 'TESTE: reenvia para o grupo a mensagem mais recente do canal com esta palavra (deixe vazio para a rodada normal)'
        required: false
        default: ''
      canal_teste:
        description: 'TESTE: canal a consultar'
        required: false
        default: 'gatunopromos'

concurrency:
  group: alerta-promo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --prefix scripts/alerta-promo --no-audit --no-fund

      - name: Vigiar canais
        run: node scripts/alerta-promo/alerta-promo.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TESTE_PALAVRA: ${{ inputs.palavra_teste }}
          TESTE_CANAL: ${{ inputs.canal_teste }}
